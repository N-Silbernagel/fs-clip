name: Test

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cross-compile:
    name: Cross-platform builds and packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build every release target
        run: go test -tags=crosscompile -v -timeout=5m ./integration
      - name: Verify release packaging without publishing
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --snapshot --clean --skip=publish

  test:
    name: Clipboard (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install X11 test environment
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth xclip
      - name: Unit tests and static checks
        run: |
          go test -race ./...
          go vet ./...
      - name: Linux installation and clipboard integration
        if: runner.os == 'Linux'
        run: env -u WAYLAND_DISPLAY xvfb-run -a go test -race -tags=integration -v -timeout=5m ./integration
      - name: macOS installation and clipboard integration
        if: runner.os == 'macOS'
        run: go test -race -tags=integration -v -timeout=5m ./integration
      - name: Windows installation and clipboard integration
        if: runner.os == 'Windows'
        run: go test -race -tags=integration -v -timeout=5m ./integration
