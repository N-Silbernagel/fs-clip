name: Test

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cross-compile:
    name: Cross-platform builds and packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build every release target
        run: go test -tags=crosscompile -v -timeout=5m ./integration
      - name: Verify release packaging without publishing
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --snapshot --clean --skip=publish

  test:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            platform: Linux
          - os: macos-15
            arch: arm64
            platform: macOS
          - os: windows-2025
            arch: amd64
            platform: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Verify runtime architecture
        shell: bash
        run: test "$(go env GOHOSTARCH)" = "${{ matrix.arch }}"
      - name: Install X11 test environment
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth xclip
      - name: Unit tests and static checks
        run: |
          go test -race ./...
          go vet ./...
      - name: Compile Windows setup executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -ldflags '-s -w -H=windowsgui' -o dist/fs-clip.exe .
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            choco install innosetup --no-progress -y
          }
          & $iscc '/DMyVersion=0.0.0-test' '/DMyArch=amd64' "/DMyBinary=$((Resolve-Path dist/fs-clip.exe).Path)" packaging/windows/fs-clip.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath dist/fs-clip_0.0.0-test_windows_amd64_setup.exe)) {
            throw 'Inno Setup did not produce the expected installer.'
          }
      - name: Linux installation and clipboard integration
        if: runner.os == 'Linux'
        run: env -u WAYLAND_DISPLAY xvfb-run -a go test -race -tags=integration -v -timeout=5m ./integration
      - name: macOS installation and clipboard integration
        if: runner.os == 'macOS'
        run: go test -race -tags=integration -v -timeout=5m ./integration
      - name: Windows installation and clipboard integration
        if: runner.os == 'Windows'
        run: go test -race -tags=integration -v -timeout=5m ./integration
