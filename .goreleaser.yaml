# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2
project_name: fs-clip

builds:
  - id: linux
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  - id: darwin
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64

  - id: windows
    ldflags:
      - -s -w -H=windowsgui
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: linux
    ids:
      - linux
    formats: ['tar.gz']
    files:
      - LICENSE.txt
      - README.md

  - id: darwin
    ids:
      - darwin
    formats: ['tar.gz']
    files:
      - LICENSE.txt
      - README.md

  - id: windows
    ids:
      - windows
    formats: ['zip']
    files:
      - LICENSE.txt
      - README.md

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_checksums.txt'

release:
  prerelease: auto
  make_latest: true
  extra_files:
    - glob: ./scripts/install.sh
    - glob: ./scripts/install.ps1
